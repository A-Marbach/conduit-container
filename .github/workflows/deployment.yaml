name: Deploy Conduit to VM

on:
  push:
    branches:
      - main
      - feature

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      # 2️⃣ Login bei GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Backend-Image bauen & pushen
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/a-marbach/conduit-backend:latest
            ghcr.io/a-marbach/conduit-backend:${{ github.sha }}

      # 4️⃣ Frontend-Image bauen & pushen
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/a-marbach/conduit-frontend:latest
            ghcr.io/a-marbach/conduit-frontend:${{ github.sha }}

      # 5️⃣ Deployment auf VM
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/conduit-container
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose pull
            docker-compose up -d --force-recreate
            docker image prune -f
