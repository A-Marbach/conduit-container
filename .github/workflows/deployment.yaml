name: Deploy Conduit to VM

on:
  push:
    branches:
      - main
      - feature
  workflow_dispatch:

jobs:

  # 0️⃣ Gitleaks - Secret Detection (FIRST - vor allem anderen!)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Full history für Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          exit-code: 1
          redact: true # Verstecke gefundene Secrets in Logs
          
  scan:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

      - name: List files (debug)
        run: |
          ls -la backend/
          ls -la frontend/

      - name: List files (debug)
        run: |
          ls -la backend/
          ls -la frontend/

      - name: Build backend for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: conduit-backend:scan

      - name: Build frontend for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: conduit-frontend:scan

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: conduit-backend:scan
          format: table
          severity: CRITICAL,HIGH

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: conduit-frontend:scan
          format: table
          severity: CRITICAL,HIGH

  # 2️⃣ Build & Push (nur wenn scan erfolgreich)
  build:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/a-marbach/conduit-backend:latest
            ghcr.io/a-marbach/conduit-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/a-marbach/conduit-frontend:latest
            ghcr.io/a-marbach/conduit-frontend:${{ github.sha }}

  # 3️⃣ 
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          cd /opt/conduit
          docker compose pull
          docker compose up -d --remove-orphans

          # Health Check
          docker compose ps
          curl -f http://localhost || exit 1

          docker image prune -f