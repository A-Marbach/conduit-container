name: Deploy Conduit to VM

on:
  push:
    branches:
      - main
      - feature
  workflow_dispatch:

jobs:

  # 0️⃣ Gitleaks - Secret Detection (FIRST - vor allem anderen!)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Full history für Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
          exit-code: 1
          redact: true # Verstecke gefundene Secrets in Logs

  # 1️⃣ Dependency & Code Quality Scanning
  quality:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      # npm audit für Backend
      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm ci && npm audit --audit-level=moderate || true

      # npm audit für Frontend
      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm ci && npm audit --audit-level=moderate || true

      # SonarQube Code Quality Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=conduit -Dsonar.projectName=Conduit
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
        continue-on-error: true

  scan:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

      - name: List files (debug)
        run: |
          ls -la backend/
          ls -la frontend/

      - name: List files (debug)
        run: |
          ls -la backend/
          ls -la frontend/

      - name: Build backend for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: conduit-backend:scan

      - name: Build frontend for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: conduit-frontend:scan

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: conduit-backend:scan
          format: table
          severity: CRITICAL,HIGH

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: conduit-frontend:scan
          format: table
          severity: CRITICAL,HIGH

  # 2️⃣ Build & Push (nur wenn scan erfolgreich)
  build:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/a-marbach/conduit-backend:latest
            ghcr.io/a-marbach/conduit-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/a-marbach/conduit-frontend:latest
            ghcr.io/a-marbach/conduit-frontend:${{ github.sha }}

  # 3️⃣ 
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose to server
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $GITHUB_WORKSPACE/docker-compose.yaml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/conduit-container/

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/conduit-container
            export FRONTEND_VERSION=${{ github.sha }}
            export BACKEND_VERSION=${{ github.sha }}
            docker-compose pull
            docker-compose down
            docker-compose up -d --force-recreate
            docker image prune -f
