services:
  frontend:
    image: ghcr.io/A-Marbach/conduit-frontend:latest
    ports:
      - "8282:80"
    volumes:
      - frontend_data:/app/data   
    restart: on-failure

  backend:
    image: ghcr.io/A-Marbach/conduit-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/data    
    restart: on-failure
    env_file:
      - ./backend/.env

volumes:
  frontend_data:
  backend_data:
