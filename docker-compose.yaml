version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8282:80"
    volumes:
      - ./frontend:/app  
    restart: on-failure


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"  
    volumes:
      - ./backend:/app  
    restart: on-failure
    env_file:
      - ./backend/.env
